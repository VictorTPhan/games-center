<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Party</title>
  <meta name="description" content="Quick browser games you can play right now." />
  <link rel="icon" type="image/svg+xml" href="assets/bun.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body class="menu">
  <canvas id="sky" aria-hidden="true"></canvas>
  <header class="site-header" id="site-header"></header>

  <main class="games">
    <h1 class="visually-hidden">Games</h1>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="ground" aria-hidden="true"></footer>

  <script src="assets/games.js"></script>
  <script src="assets/sky.js"></script>
  <script>
    renderHeader(null);

    document.getElementById("grid").innerHTML = PIXEL_PARTY_GAMES.map((game) => {
      const best = bestScoreText(game);
      return `
        <a class="card" href="${game.page}" style="--tint: ${game.tint}">
          <div class="shot">
            <img src="assets/${game.id}.jpg" alt="" />
            <img class="moving" src="assets/${game.id}.webp" alt="" loading="lazy" />
          </div>
          <div class="card-body">
            <h2>${game.title}</h2>
            <p>${game.blurb}</p>
            <div class="card-foot">
              ${best ? `<span class="best">${icon("trophy")}${best}</span>` : ""}
              <span class="play">${icon("play_arrow")}Play</span>
            </div>
          </div>
        </a>`;
    }).join("");
  </script>
</body>
</html>
